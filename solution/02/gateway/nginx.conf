user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    keepalive_timeout 65;
    gzip on;

    upstream security { server security:3000; }
    upstream uploader { server uploader:3000; }
    upstream storage  { server storage:9000; }

    server {
        listen 8080;
        server_name localhost;

        client_max_body_size 20M;

        # Внутренний эндпоинт проверки токена.
        # Nginx делает subrequest сюда, тот перенаправляет запрос
        # в сервис security GET /v1/token/validation.
        # Любой ответ, отличный от 2xx, блокирует доступ.
        location = /auth {
            internal;
            proxy_pass http://security/v1/token/validation;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        # ---- Анонимные эндпоинты ----

        # POST /v1/register -> security POST /v1/user
        location = /v1/register {
            proxy_pass http://security/v1/user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # POST /v1/token и POST /token -> security POST /v1/token
        location = /v1/token {
            proxy_pass http://security/v1/token;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /token {
            proxy_pass http://security/v1/token;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ---- Эндпоинты с проверкой токена ----

        # GET /v1/user -> security GET /v1/user (информация о пользователе)
        location = /v1/user {
            auth_request /auth;
            proxy_pass http://security/v1/user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        # POST /v1/upload и POST /upload -> uploader POST /v1/upload
        location = /v1/upload {
            auth_request /auth;
            proxy_pass http://uploader/v1/upload;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /upload {
            auth_request /auth;
            proxy_pass http://uploader/v1/upload;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # GET /v1/user/{image} -> minio GET /images/{image}
        location /v1/user/ {
            auth_request /auth;
            proxy_pass http://storage/images/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # GET /images/{image} -> minio GET /images/{image}
        # Прямое обращение к бакету images (S3-путь /{bucket}/{object})
        location /images/ {
            proxy_pass http://storage;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ---- Служебные эндпоинты (healthcheck / метрики) ----
        location /status {
            proxy_pass http://uploader/status;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /metrics {
            proxy_pass http://uploader/metrics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}