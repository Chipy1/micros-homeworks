volumes:
  data:

services:
  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: always
    expose:
      - 9000
    environment:
      MINIO_ROOT_USER: ${Storage_AccessKey:-storage}
      MINIO_ROOT_PASSWORD: ${Storage_Secret:-qwerty123456}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  createbuckets:
    image: minio/mc
    depends_on:
      - storage
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set storage http://storage:9000 ${Storage_AccessKey:-storage} ${Storage_Secret:-qwerty123456} &&
      /usr/bin/mc mb --ignore-existing storage/${Storage_Bucket:-images} &&
      /usr/bin/mc anonymous set download storage/${Storage_Bucket:-images} &&
      exit 0;
      "

  uploader:
    build: ./uploader
    depends_on:
      - storage
      - createbuckets
    expose:
      - 3000
    environment:
      PORT: 3000
      S3_HOST: storage
      S3_PORT: 9000
      S3_ACCESS_KEY: ${Storage_AccessKey:-storage}
      S3_ACCESS_SECRET: ${Storage_Secret:-qwerty123456}
      S3_BUCKET: ${Storage_Bucket:-images}
    labels:
      - "logging=vector"

  security:
    build: ./security
    expose:
      - 3000
    environment:
      PORT: 3000
    labels:
      - "logging=vector"

  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:8080"
    labels:
      - "logging=vector"
    depends_on:
      - storage
      - uploader
      - security

networks:
  default:
    name: microservices_default