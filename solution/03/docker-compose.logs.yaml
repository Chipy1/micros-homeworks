# Stack "Логи" (задача 4) — Vector + ElasticSearch + Kibana
# ВНИМАНИЕ: порт 8080 занят API Gateway из solution/02. Kibana публикуется на 8081.

services:
  es:
    image: elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=qwerty123456
      - xpack.security.enabled=true
      - xpack.security.authc.api_key.enabled=true
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.transport.ssl.enabled=false
      - xpack.security.http.ssl.enabled=false
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health -u elastic:qwerty123456 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  es-init:
    image: curlimages/curl:8.9.1
    depends_on:
      es:
        condition: service_healthy
    volumes:
      - ./configs/es-init/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  kibana:
    image: kibana:8.13.4
    depends_on:
      es:
        condition: service_healthy
      es-init:
        condition: service_completed_successfully
    volumes:
      - ./configs/kibana-init/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "8081:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  vector:
    image: timberio/vector:0.39.0-debian
    depends_on:
      es:
        condition: service_healthy
      es-init:
        condition: service_completed_successfully
    volumes:
      - ./configs/vector/vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["--config", "/etc/vector/vector.toml"]
    restart: "no"

volumes:
  esdata: