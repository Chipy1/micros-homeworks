global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # метрики самих сервисов API Gateway (solution/02)
  - job_name: app-services
    static_configs:
      - targets:
          - uploader:3000
          - security:3000

  # метрики хоста (node_exporter/cAdvisor на хосте, если запущены)
  - job_name: nodes
    static_configs:
      - targets:
          - host.docker.internal:9100

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090